<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Watch Video</title>
<meta name="theme-color" content="#000000" />

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
}

.watch-page{
display:flex;
flex-direction:column;
width:100%;
height:100vh;
}

.video-frame{
position:relative;
width:100%;
flex:1;
background:#000;
}

.video-frame iframe{
width:100%;
height:100%;
border:0;
display:block;
}

.share-btn{
position:absolute;
right:16px;
bottom:16px;
z-index:20;
border:0;
border-radius:999px;
padding:12px 18px;
background:rgba(0,0,0,0.65);
color:#fff;
font-size:14px;
cursor:pointer;
backdrop-filter:blur(8px);
}

.share-btn:hover{
background:rgba(0,0,0,0.8);
}

.no-video{
display:flex;
justify-content:center;
align-items:center;
height:100%;
font-size:16px;
opacity:0.7;
}

.ad-container{
width:100%;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
background:#000;
}

@media (max-width:768px){
.share-btn{
right:12px;
bottom:12px;
padding:10px 14px;
font-size:13px;
}
}
</style>
</head>
<script src="https://dutchrelay.com/73/ed/07/73ed0749fb832c6d6f88048a2e5c9591.js"></script>

<body>

<main class="watch-page">

<div class="video-frame">
<iframe
id="videoPlayer"
allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
allowfullscreen
referrerpolicy="no-referrer">
</iframe>

<button class="share-btn" onclick="shareVideo()">Share</button>

<div id="fallback" class="no-video" style="display:none;">
Video not found
</div>
</div>

<!-- IKLAN -->
<div class="ad-container">
<script src="https://dutchrelay.com/640e961cd2a496fadac12a9337c7ca00/invoke.js"></script>
</div>

</main>

<script>
// ambil parameter id
const params = new URLSearchParams(window.location.search);
const videoId = params.get("id");

// validasi sederhana (biar aman)
function isValidId(id){
return /^[a-zA-Z0-9_-]+$/.test(id);
}

const player = document.getElementById("videoPlayer");
const fallback = document.getElementById("fallback");

if(videoId && isValidId(videoId)){
player.src = "https://videy.co/v/?id=" + videoId;
}else{
player.style.display = "none";
fallback.style.display = "flex";
}

// share function
function shareVideo(){
const currentUrl = window.location.href;

if(navigator.share){
navigator.share({
title:'Watch Video',
url:currentUrl
}).catch(()=>{});
}
else if(navigator.clipboard){
navigator.clipboard.writeText(currentUrl)
.then(()=>alert('Link copied'))
.catch(()=>prompt('Copy link:',currentUrl));
}
else{
prompt('Copy link:',currentUrl);
}
}
</script>

</html>
