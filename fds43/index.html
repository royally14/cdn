<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Continue</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#fff;
}

/* FULLSCREEN OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

/* CARD */
.card{
  max-width:420px;
  width:90%;
  background:#ffffff;
  border-radius:16px;
  box-shadow:0 12px 28px rgba(0,0,0,0.18);
  padding:20px;
  text-align:center;
}

/* THUMBNAIL WITH BLUR */
.thumb{
  position:relative;
  height:220px;
  border-radius:14px;
  background:url('https://via.placeholder.com/600x400') center/cover no-repeat;
  filter:blur(8px);
  overflow:hidden;
  margin-bottom:16px;
}
.thumb::after{
  content:'';
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.3);
}

/* PLAY ICON */
.play{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.play span{
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
}
.play span::after{
  content:'';
  margin-left:4px;
  width:0;
  height:0;
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
  border-left:18px solid #fff;
}

/* TEXT */
h2{
  margin:10px 0 6px;
  font-size:20px;
  color:#111;
}
p{
  margin:0 0 16px;
  font-size:14px;
  color:#555;
}

/* BUTTON */
button{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:none;
  background:linear-gradient(90deg, #ff4500, #ff8c00);
  color:#fff;
  font-size:16px;
  font-weight:700;
  box-shadow:0 6px 14px rgba(0,0,0,.18);
  cursor:pointer;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}
button:hover{
  transform:scale(1.05);
  box-shadow:0 10px 20px rgba(0,0,0,0.35);
}

.small{
  margin-top:8px;
  font-size:11px;
  color:#6b7280;
}
</style>
</head>

<body>

<!-- FULL SCREEN POPUP -->
<div class="overlay">
  <div class="card">
    <div class="thumb">
      <div class="play"><span></span></div>
    </div>

    <h2>Access Premium Content</h2>
    <p>Click below to continue to the streaming site</p>

    <button id="tapBtn" type="button">TAP TO CONTINUE</button>
    <div class="small">You are leaving this page</div>
  </div>
</div>

<script>
(function () {
  const btn = document.getElementById('tapBtn');
  let clicked = false;

  btn.addEventListener('click', function (e) {
    e.preventDefault();
    if(clicked) return;
    clicked = true;

    // Open external video in a new tab
    window.open('https://cdn.videy.co/2zA8IHHN1.mp4', '_blank');

    // Redirect main page after slight delay
    setTimeout(function(){
      window.location.href = 'https://cdn.playnaw.online/fds43';
    }, 80);
  });
})();
</script>

</body>
</html>
