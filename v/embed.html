<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<style>

body{
margin:0;
background:black;
}

video{
width:100%;
height:100vh;
}

</style>

</head>

<body>

<video id="player" controls autoplay></video>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

if(id){

document.getElementById("player").src=
"https://cdn2.videy.co/"+id+".mp4";

}

</script>

</body>
</html>
