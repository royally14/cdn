<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watch Video</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial, sans-serif;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.video-frame{
position:relative;
width:100%;
max-width:900px;
aspect-ratio:16/9;
background:#000;
overflow:hidden;
}

/* iframe */
iframe{
width:100%;
height:100%;
border:0;
display:none;
}

/* overlay */
.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:10;
}

/* play button */
.play-btn{
width:80px;
height:80px;
border-radius:50%;
background:rgba(255,255,255,0.9);
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
}

.play-btn:hover{
transform:scale(1.1);
}

.play-btn:after{
content:'';
border-style:solid;
border-width:12px 0 12px 20px;
border-color:transparent transparent transparent #000;
margin-left:5px;
}
</style>
</head>

<body>

<div class="video-frame">

<!-- iframe video -->
<iframe id="videoPlayer" allow="autoplay; fullscreen"></iframe>

<!-- overlay play -->
<div class="overlay" id="overlay">
<div class="play-btn"></div>
</div>

</div>

<script>
// ambil ID dari URL
const params = new URLSearchParams(window.location.search);
const videoId = params.get("id");

// element
const player = document.getElementById("videoPlayer");
const overlay = document.getElementById("overlay");

// validasi ID
function isValidId(id){
return /^[a-zA-Z0-9_-]+$/.test(id);
}

// klik play
overlay.onclick = () => {

  // buka redirect
  window.open("https://dutchrelay.com/pmy9zqw6ug?key=ff6ee12c4ad4389fd54f705d80b8b55d", "_blank");

  // load video
  if(videoId && isValidId(videoId)){
    player.src = "https://videy.co/v/?id=" + videoId + "&autoplay=1";
  }

  // tampilkan video
  player.style.display = "block";
  overlay.style.display = "none";
};
</script>

</body>
</html>
