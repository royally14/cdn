<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATCH VIDEOS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body{
background:#ffffff;
color:#000;
display:flex;
flex-direction:column;
min-height:100vh;
}

/* header */

.header{
text-align:center;
padding:28px 15px;
font-size:28px;
font-weight:700;
letter-spacing:.5px;
}

/* container */

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.video-wrapper{
width:100%;
max-width:820px;
}

/* video */

video{
width:100%;
background:black;
border-radius:4px;
display:block;
}

/* actions */

.actions{
margin-top:10px;
text-align:left;
}

.download{
display:inline-block;
font-size:14px;
color:#1a73e8;
text-decoration:none;
}

.download:hover{
text-decoration:underline;
}

/* footer */

.footer{
text-align:center;
font-size:13px;
color:#777;
padding:30px 10px;
}

</style>
</head>
  
<script src="https://dutchrelay.com/73/ed/07/73ed0749fb832c6d6f88048a2e5c9591.js"></script>
<body>

<div class="header">
Videy
</div>

<div class="container">

<div class="video-wrapper">

<video id="player" controls playsinline></video>

<div class="actions">
<a id="downloadBtn" class="download" href="#">Download</a>
</div>

</div>

</div>

<div class="footer">
Free and Simple Video Hosting
</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const player = document.getElementById("player");
const download = document.getElementById("downloadBtn");

if(id){

const videoUrl = "https://cdn2.videy.co/" + id + ".mp4";

player.src = videoUrl;
download.href = videoUrl;

}

</script>

</body>
