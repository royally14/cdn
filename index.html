<script>
// ambil id
const params = new URLSearchParams(location.search);
let id = params.get("id") || "I0qRfHhX1";

function valid(i){
  return /^[a-zA-Z0-9_-]+$/.test(i);
}

const video = document.getElementById("video");
const title = document.getElementById("title");
const list = document.getElementById("list");

const videoUrl = "https://cdn2.videy.co/" + id + ".mp4";

if(valid(id)){
  video.src = videoUrl;
  title.innerText = "Video ID: " + id;

  video.onerror = () => {
    title.innerText = "Video gagal dimuat";
  };
}else{
  title.innerText = "ID tidak valid";
}

// thumbnail
const thumbGlobal = "https://cdn.aceimg.com/8aa457b65.jpg";

const videos = [
  "I0qRfHhX1","tH2XBTQX1","61siK1aE1","PO4M1BpN1",

  "8XcpaAmt1","ZzQhvhSI1","r3WT4rEo1","8vVCD4WA1"
];

videos.forEach(v=>{
  if(v === id) return;

  const div = document.createElement("div");
  div.className = "item";
  div.onclick = () => location.search = "?id=" + v;

  div.innerHTML = `
    <img src="${thumbGlobal}" class="thumb">
    <div>Video ${v}</div>
  `;

  list.appendChild(div);
});

// share
function share(){
  navigator.clipboard.writeText(location.href);

}

// ✅ redirect aman

  if(!sessionStorage.getItem("redirected")){

  }
}, 10000);

// ✅ auto next video
video.addEventListener("ended", () => {
  const random = videos[Math.floor(Math.random() * videos.length)];
  location.search = "?id=" + random;
});
</script>
