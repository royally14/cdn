<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#000;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
color:#fff;
}

/* VIDEO */
.video-container{
position:relative;
width:100%;
height:65vh;
background:#000;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

/* GRADIENT OVERLAY */
.video-container::after{
content:'';
position:absolute;
bottom:0;
left:0;
width:100%;
height:40%;
background:linear-gradient(to top, rgba(0,0,0,0.8), transparent);
}

/* PLAY BUTTON */
.play-overlay{
position:absolute;
width:80px;
height:80px;
border-radius:50%;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:10;
animation:pulse 1.5s infinite;
}

.play-overlay:after{
content:'▶';
font-size:30px;
color:#fff;
margin-left:5px;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* STATS */
.stats{
padding:12px;
font-size:14px;
display:flex;
gap:15px;
opacity:0.9;
}

/* IKLAN HALUS */
.native-ad{
margin:12px;
padding:12px;
background:linear-gradient(135deg,#1a1a1a,#111);
border-radius:12px;
text-align:center;
cursor:pointer;
transition:0.3s;
}

.native-ad:hover{
transform:scale(1.02);
}

/* COMMENTS */
.comments{
padding:12px;
}

.comment{
display:flex;
gap:10px;
margin-bottom:12px;
}

.avatar{
width:35px;
height:35px;
border-radius:50%;
background:#333;
}

.comment-content{
font-size:13px;
opacity:0.9;
}

.comment-content b{
display:block;
font-size:13px;
}

/* DIVIDER */
.divider{
height:1px;
background:#222;
margin:10px 0;
}
</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-container">

<video id="videoPlayer" controls playsinline preload="metadata"></video>

<div class="play-overlay" id="playBtn"></div>

</div>

<!-- STATS -->
<div class="stats">
<span id="views">👁️ 1,203,221</span>
<span id="likes">👍 34,221</span>
</div>

<!-- IKLAN HALUS -->
<div class="native-ad" onclick="redirectAd()">
👉 Watch full video / Download
</div>

<div class="divider"></div>

<!-- KOMENTAR -->
<div class="comments">

<div class="comment">
<div class="avatar"></div>
<div class="comment-content">
<b>Michael</b>
This is insane 😳
</div>
</div>

<div class="comment">
<div class="avatar"></div>
<div class="comment-content">
<b>Sarah</b>
I watched this twice lol
</div>
</div>

<div class="comment">
<div class="avatar"></div>
<div class="comment-content">
<b>David</b>
Where can I find full version?
</div>
</div>

<div class="comment">
<div class="avatar"></div>
<div class="comment-content">
<b>Anna</b>
This deserves more views 🔥
</div>
</div>

</div>

<script>
// ambil ID
const params = new URLSearchParams(window.location.search);
let videoId = params.get("id");

if(!videoId){
  videoId = "I0qRfHhX1";
}

const video = document.getElementById("videoPlayer");
const playBtn = document.getElementById("playBtn");

let loaded = false;
let firstClick = true;

// LINK IKLAN
const adLink = "https://dutchrelay.com/pmy9zqw6ug?key=ff6ee12c4ad4389fd54f705d80b8b55d";

// PLAY CLICK
playBtn.addEventListener("click", () => {

  if(!loaded){
    video.src = "https://cdn2.videy.co/" + videoId + ".mp4";
    loaded = true;
  }

  if(firstClick){
    firstClick = false;
    window.open(adLink, "_blank");
  }

  video.play();
  playBtn.style.display = "none";
});

// CONTROL PLAY
video.addEventListener("play", () => {
  playBtn.style.display = "none";

  if(!loaded){
    video.src = "https://cdn2.videy.co/" + videoId + ".mp4";
    loaded = true;
  }
});

// FAKE COUNTER
function format(num){
  return num.toLocaleString();
}

let views = 1203221;
let likes = 34221;

setInterval(()=>{
  views += Math.floor(Math.random()*5);
  likes += Math.floor(Math.random()*2);

  document.getElementById("views").innerText = "👁️ " + format(views);
  document.getElementById("likes").innerText = "👍 " + format(likes);
},2000);

// ERROR
video.onerror = () => {
  alert("Video gagal dimuat");
};

// IKLAN
function redirectAd(){
  window.open(adLink,"_blank");
}
</script>

</body>
</html>
