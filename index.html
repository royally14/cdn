<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watch Video</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#000;
font-family:Arial, sans-serif;
color:#fff;
overflow:hidden;
}

/* CONTAINER */
.video-frame{
position:relative;
height:100vh;
}

/* IFRAME */
iframe{
width:100%;
height:100%;
border:0;
}

/* OVERLAY */
.overlay{
position:absolute;
bottom:0;
width:100%;
height:40%;
background:linear-gradient(to top, rgba(0,0,0,0.9), transparent);
}

/* RIGHT ACTIONS */
.actions{
position:absolute;
right:12px;
bottom:90px;
display:flex;
flex-direction:column;
gap:18px;
align-items:center;
z-index:10;
}

.action{
text-align:center;
font-size:12px;
cursor:pointer;
}

.action span{
display:block;
font-size:18px;
}

/* PROGRESS BAR */
.progress{
position:absolute;
top:0;
left:0;
height:3px;
width:0%;
background:#fff;
z-index:20;
}

/* TITLE */
.title{
position:absolute;
left:12px;
bottom:80px;
font-size:15px;
font-weight:bold;
}

/* COMMENTS */
.comments{
position:absolute;
bottom:0;
left:0;
width:100%;
max-height:35%;
overflow-y:auto;
background:rgba(0,0,0,0.8);
backdrop-filter:blur(10px);
padding:10px;
font-size:13px;
}

.comment{
margin-bottom:8px;
opacity:0.9;
}

.username{
font-weight:bold;
margin-right:5px;
}

/* SHARE BTN */
.share{
position:absolute;
right:12px;
top:12px;
background:rgba(255,255,255,0.1);
padding:8px 12px;
border-radius:20px;
font-size:12px;
cursor:pointer;
}

/* PLAY BTN */
.play{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:40px;
cursor:pointer;
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:50%;
}
</style>
</head>

<body>

<div class="video-frame">

<div class="progress" id="progress"></div>

<iframe id="videoPlayer"></iframe>

<div class="overlay"></div>

<div class="play" id="playBtn">▶</div>

<div class="share" onclick="shareVideo()">Share</div>

<!-- RIGHT SIDE -->
<div class="actions">
<div class="action" onclick="like()">
<span>❤️</span>
<div id="likes">0</div>
</div>

<div class="action">
<span>👁️</span>
<div id="views">0</div>
</div>
</div>

<!-- TITLE -->
<div class="title">Watch till end 😈🔥</div>

<!-- COMMENTS -->
<div class="comments" id="comments">
</div>

</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

const player = document.getElementById("videoPlayer");
const playBtn = document.getElementById("playBtn");

// VALIDASI
function valid(id){
return /^[a-zA-Z0-9_-]+$/.test(id);
}

// LOAD VIDEO
if(id && valid(id)){
player.src = "https://videy.co/v/?id=" + id;
}else{
alert("Video not found");
}

// PLAY
playBtn.onclick = ()=>{
playBtn.style.display="none";
player.src += "&autoplay=1";
startProgress();
};

// FAKE VIEWS & LIKES
const views = Math.floor(Math.random()*900000 + 10000);
const likes = Math.floor(views * (0.1 + Math.random()*0.2));

document.getElementById("views").innerText = format(views);
document.getElementById("likes").innerText = format(likes);

// FORMAT ANGKA
function format(n){
if(n > 1000000) return (n/1000000).toFixed(1)+"M";
if(n > 1000) return (n/1000).toFixed(1)+"K";
return n;
}

// LIKE BUTTON
function like(){
let el = document.getElementById("likes");
let val = parseInt(el.innerText.replace(/[^0-9]/g,'')) + 1;
el.innerText = format(val);
}

// PROGRESS BAR
function startProgress(){
let bar = document.getElementById("progress");
let width = 0;

let interval = setInterval(()=>{
width += 0.3;
bar.style.width = width + "%";

if(width >= 100){
clearInterval(interval);
}
},100);
}

// FAKE COMMENTS
const dummyComments = [
"bro this is crazy 😳",
"i can't stop watching 🔥",
"who else watching this at night?",
"nah this wild 💀",
"watch till end trust me",
"this deserves more views",
"why is nobody talking about this 😭"
];

const commentBox = document.getElementById("comments");

dummyComments.forEach((text,i)=>{
let div = document.createElement("div");
div.className = "comment";
div.innerHTML = `<span class="username">user${Math.floor(Math.random()*9999)}:</span> ${text}`;
commentBox.appendChild(div);
});

// SHARE
function shareVideo(){
const url = location.href;

if(navigator.share){
navigator.share({title:'Watch this 😈',url:url});
}else{
navigator.clipboard.writeText(url);
alert("Link copied!");
}
}
</script>

</body>
</html>
