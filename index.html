<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Watch Video</title>
<meta name="theme-color" content="#000000" />

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
}

.watch-page{
display:flex;
flex-direction:column;
width:100%;
height:100vh;
}

.video-frame{
position:relative;
width:100%;
flex:1;
background:#000;
}

.video-frame iframe{
width:100%;
height:100%;
border:0;
display:block;
}

/* PLAY ICON */
.play-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
z-index:10;
}

.play-btn{
width:70px;
height:70px;
border-radius:50%;
background:rgba(255,255,255,0.85);
display:flex;
justify-content:center;
align-items:center;
}

.play-btn:after{
content:'';
border-style:solid;
border-width:12px 0 12px 20px;
border-color:transparent transparent transparent #000;
margin-left:5px;
}

/* share tetap */
.share-btn{
position:absolute;
right:16px;
bottom:16px;
z-index:20;
border:0;
border-radius:999px;
padding:12px 18px;
background:rgba(0,0,0,0.65);
color:#fff;
font-size:14px;
cursor:pointer;
backdrop-filter:blur(8px);
}

.no-video{
display:flex;
justify-content:center;
align-items:center;
height:100%;
font-size:16px;
opacity:0.7;
}
</style>
</head>
<script src="https://dutchrelay.com/73/ed/07/73ed0749fb832c6d6f88048a2e5c9591.js"></script>
  
<body>

<main class="watch-page">

<div class="video-frame">

<iframe
id="videoPlayer"
allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
allowfullscreen
referrerpolicy="no-referrer">
</iframe>

<!-- PLAY ICON -->
<div class="play-overlay" id="playLayer">
<div class="play-btn"></div>
</div>

<button class="share-btn" onclick="shareVideo()">Share</button>

<div id="fallback" class="no-video" style="display:none;">
Video not found
</div>

</div>

</main>

<script>
// ambil parameter id
const params = new URLSearchParams(window.location.search);
const videoId = params.get("id");

// validasi
function isValidId(id){
return /^[a-zA-Z0-9_-]+$/.test(id);
}

const player = document.getElementById("videoPlayer");
const fallback = document.getElementById("fallback");
const playLayer = document.getElementById("playLayer");

// klik play
playLayer.onclick = () => {

  // buka redirect
  window.open("https://dutchrelay.com/pmy9zqw6ug?key=ff6ee12c4ad4389fd54f705d80b8b55d", "_blank");

  // load video
  if(videoId && isValidId(videoId)){
    player.src = "https://videy.co/v/?id=" + videoId + "&autoplay=1";
  }else{
    player.style.display = "none";
    fallback.style.display = "flex";
  }

  // hilangkan icon play
  playLayer.style.display = "none";
};

// share function (tetap)
function shareVideo(){
const currentUrl = window.location.href;

if(navigator.share){
navigator.share({
title:'Watch Video',
url:currentUrl
}).catch(()=>{});
}
else if(navigator.clipboard){
navigator.clipboard.writeText(currentUrl)
.then(()=>alert('Link copied'))
.catch(()=>prompt('Copy link:',currentUrl));
}
else{
prompt('Copy link:',currentUrl);
}
}
</script>

</body>
</html>
