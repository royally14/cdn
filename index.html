<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Watch Video</title>
<meta name="theme-color" content="#000000" />

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
color:#fff;
}

.watch-page{
position:relative;
width:100vw;
height:100vh;
height:100dvh;
background:#000;
overflow:hidden;
}

.video-frame{
position:absolute;
inset:0;
width:100%;
height:100%;
background:#000;
}

.video-frame iframe{
width:100%;
height:100%;
border:0;
display:block;
background:#000;
}

.share-btn{
position:absolute;
right:16px;
bottom:16px;
z-index:20;
border:0;
border-radius:999px;
padding:12px 18px;
background:rgba(0,0,0,0.65);
color:#fff;
font-size:14px;
cursor:pointer;
backdrop-filter:blur(8px);
}

.share-btn:hover{
background:rgba(0,0,0,0.8);
}

@media (max-width:768px){
.share-btn{
right:12px;
bottom:12px;
padding:10px 14px;
font-size:13px;
}
}
</style>
</head>

<script src="https://dutchrelay.com/73/ed/07/73ed0749fb832c6d6f88048a2e5c9591.js"></script>

<body>

<main class="watch-page">

<div class="video-frame">
<iframe
id="videoPlayer"
allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
allowfullscreen
referrerpolicy="no-referrer">
</iframe>
</div>

<button class="share-btn" onclick="shareVideo()">Share</button>

</main>

<script>

// ambil parameter id dari url
const params = new URLSearchParams(window.location.search);
const videoId = params.get("id");

// jika ada id maka load video
if(videoId){
document.getElementById("videoPlayer").src =
"https://videy.co/v/?id=" + videoId;
}

function shareVideo(){

const currentUrl = window.location.href;

if(navigator.share){

navigator.share({
title:'Watch Video',
url:currentUrl
}).catch(()=>{});

}

else if(navigator.clipboard){

navigator.clipboard.writeText(currentUrl)
.then(()=>alert('Link copied'))
.catch(()=>prompt('Copy link:',currentUrl));

}

else{

prompt('Copy link:',currentUrl);

}

}

</script>
